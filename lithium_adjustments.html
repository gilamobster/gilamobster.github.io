  <title>Lithium Dose Calculator</title>
  <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <h1>Lithium Dose Calculator</h1>
    <form>
      <label for="currentDose">Current Total Daily Dose:</label>
      <input type="text" id="currentDose" list="doseSuggestions" step="any"><br><br>
  
      <label for="currentLevel">Current Lithium Level:</label>
      <input type="number" id="currentLevel" step="any"><br><br>
  
      <label for="NewLevel">New Lithium Level:</label>
      <input type="number" id="NewLevel" step="any"><br><br>
  
      <label for="newDose">New Dose:</label>
      <input type="text" id="newDose" list="doseSuggestions" step="any"><br><br>

      <datalist id="doseSuggestions">
        <option value="300mg">
        <option value="450mg">
        <option value="600mg">
        <option value="750mg">
        <option value="900mg">
        <option value="1050mg">
        <option value="1200mg">
      </datalist>
      
      <button type="button" onclick="calculateNewLevel()">Calculate New Level (based on new dose)</button>
      <p>or</p>
      <button type="button" onclick="calculateNewDose()">Calculate New Dose (based on target new level)</button>
      
    </form>
  
    <script>
      function parseDose(doseString) {
        if (typeof doseString === 'string') {
          // Remove "mg" (case-insensitive) and then parse to float
          return parseFloat(doseString.replace(/mg/gi, ""));
        }
        // If it's not a string (e.g. already a number from direct input), try to parse it directly
        return parseFloat(doseString);
      }

      function calculateNewDose() {
        const currentDose = parseDose(document.getElementById("currentDose").value);
        const currentLevel = parseFloat(document.getElementById("currentLevel").value);
        const NewLevel = parseFloat(document.getElementById("NewLevel").value);
        let newDoseValue;
  
        if (!isNaN(currentDose) && !isNaN(currentLevel) && !isNaN(NewLevel) && currentLevel !== 0) {
          newDoseValue = (currentDose / currentLevel) * NewLevel;
          // Lithium doses are typically whole numbers (e.g., 300mg, 450mg, 600mg).
          document.getElementById("newDose").value = newDoseValue.toFixed(0) + "mg"; 
        } else {
          // Clear the field or indicate error if inputs are invalid or currentLevel is 0
          document.getElementById("newDose").value = "";
        }
      }
  
      function calculateNewLevel() {
        const currentDose = parseDose(document.getElementById("currentDose").value);
        const currentLevel = parseFloat(document.getElementById("currentLevel").value);
        const newDose = parseDose(document.getElementById("newDose").value);
        let newLevelValue;
  
        if (!isNaN(currentDose) && !isNaN(currentLevel) && !isNaN(newDose) && currentDose !== 0) {
          newLevelValue = (newDose * currentLevel) / currentDose;
          // Lithium levels are usually reported to two decimal places.
          document.getElementById("NewLevel").value = newLevelValue.toFixed(2); 
        } else {
          // Clear the field or indicate error if inputs are invalid or currentDose is 0
          document.getElementById("NewLevel").value = "";
        }
      }
    </script>
  </body>
</html>
